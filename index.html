<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plan de forage – Ancrages</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #1f2937;
      color: white;
      padding: 15px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    header p {
      margin: 6px 0 0;
      font-size: 14px;
      opacity: 0.85;
    }

    #plan {
      overflow: auto;
      padding: 25px 15px 60px;
    }

    .ligne {
      display: flex;
      align-items: center;
      margin-bottom: 35px;
      min-width: max-content;
    }

    .nom-ligne {
      width: 75px;
      min-width: 75px;
      font-weight: bold;
      font-size: 14px;
    }

    .ancrages {
      display: flex;
      align-items: center;
      gap: 20px;
      position: relative;
    }

    .ancrages::before {
      content: "";
      position: absolute;
      left: 10px;
      right: 10px;
      height: 2px;
      background: #9ca3af;
      z-index: 0;
    }

    .ancrage {
      width: 34px;
      height: 34px;
      min-width: 34px;
      border-radius: 50%;
      border: 2px solid #1d4ed8;
      background: #3b82f6;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      position: relative;
      z-index: 1;
      user-select: none;
    }

    .ancrage.rempli {
      background: #16a34a;
      border-color: #15803d;
    }

    .ancrage:hover {
      transform: scale(1.12);
    }

    .decale {
      margin-left: 27px;
    }

    #modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 1000;
      padding: 15px;
    }

    .modal-content {
      background: white;
      max-width: 500px;
      margin: 30px auto;
      padding: 20px;
      border-radius: 12px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-content h2 {
      margin-top: 0;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 12px;
      margin-bottom: 5px;
    }

    input,
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #bbb;
      border-radius: 7px;
      font-size: 16px;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    .boutons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      flex: 1;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 16px;
      cursor: pointer;
    }

    .sauver {
      background: #16a34a;
      color: white;
    }

    .fermer {
      background: #d1d5db;
    }

    .supprimer {
      background: #dc2626;
      color: white;
    }

    .legende {
      padding: 0 15px 20px;
      font-size: 13px;
    }
  </style>
</head>

<body>

<header>
  <h1>Plan de forage – Ancrages</h1>
  <p>Clique sur un ancrage pour ouvrir sa fiche de forage</p>
</header>

<div id="plan"></div>

<div class="legende">
  🔵 Fiche non renseignée &nbsp;&nbsp; 🟢 Fiche renseignée
</div>

<div id="modal">
  <div class="modal-content">

    <h2 id="titreFiche">Fiche de forage</h2>

    <label>Date</label>
    <input type="date" id="date">

    <label>Foreur</label>
    <input type="text" id="foreur">

    <label>Profondeur / longueur (m)</label>
    <input type="number" step="0.1" id="profondeur">

    <label>Diamètre (mm)</label>
    <input type="number" id="diametre">

    <label>Inclinaison / angle</label>
    <input type="text" id="inclinaison">

    <label>Observations</label>
    <textarea id="observations"></textarea>

    <div class="boutons">
      <button class="fermer" onclick="fermerFiche()">Fermer</button>
      <button class="sauver" onclick="sauverFiche()">Enregistrer</button>
    </div>

    <div class="boutons">
      <button class="supprimer" onclick="supprimerFiche()">
        Effacer la fiche
      </button>
    </div>

  </div>
</div>

<script>

  // NOMBRE RÉEL D'ANCRAGES PAR LIGNE
  // Ligne 0 = EN HAUT
  const lignes = [
    26, // Ligne 0
    25, // Ligne 1
    26, // Ligne 2
    27, // Ligne 3
    27, // Ligne 4
    27, // Ligne 5
    27  // Ligne 6
  ];

  const plan = document.getElementById("plan");

  let ancrageActuel = null;

  function creerPlan() {

    plan.innerHTML = "";

    lignes.forEach((nombre, numeroLigne) => {

      const ligne = document.createElement("div");
      ligne.className = "ligne";

      const nom = document.createElement("div");
      nom.className = "nom-ligne";
      nom.textContent = "Ligne " + numeroLigne;

      const zone = document.createElement("div");
      zone.className = "ancrages";

      // Décalage d'une ligne sur deux pour le quinconce
      if (numeroLigne % 2 === 1) {
        zone.classList.add("decale");
      }

      for (let i = 1; i <= nombre; i++) {

        const point = document.createElement("div");

        point.className = "ancrage";
        point.textContent = i;

        const id = "L" + numeroLigne + "-A" + i;

        point.dataset.id = id;

        const fiche = localStorage.getItem(id);

        if (fiche) {
          point.classList.add("rempli");
        }

        point.onclick = function() {
          ouvrirFiche(id);
        };

        zone.appendChild(point);
      }

      ligne.appendChild(nom);
      ligne.appendChild(zone);

      plan.appendChild(ligne);
    });
  }

  function ouvrirFiche(id) {

    ancrageActuel = id;

    document.getElementById("titreFiche").textContent =
      "Fiche de forage – " + id;

    const fiche =
      JSON.parse(localStorage.getItem(id) || "{}");

    document.getElementById("date").value =
      fiche.date || "";

    document.getElementById("foreur").value =
      fiche.foreur || "";

    document.getElementById("profondeur").value =
      fiche.profondeur || "";

    document.getElementById("diametre").value =
      fiche.diametre || "";

    document.getElementById("inclinaison").value =
      fiche.inclinaison || "";

    document.getElementById("observations").value =
      fiche.observations || "";

    document.getElementById("modal").style.display = "block";
  }

  function fermerFiche() {
    document.getElementById("modal").style.display = "none";
  }

  function sauverFiche() {

    if (!ancrageActuel) return;

    const fiche = {

      date:
        document.getElementById("date").value,

      foreur:
        document.getElementById("foreur").value,

      profondeur:
        document.getElementById("profondeur").value,

      diametre:
        document.getElementById("diametre").value,

      inclinaison:
        document.getElementById("inclinaison").value,

      observations:
        document.getElementById("observations").value
    };

    localStorage.setItem(
      ancrageActuel,
      JSON.stringify(fiche)
    );

    fermerFiche();

    creerPlan();
  }

  function supprimerFiche() {

    if (!ancrageActuel) return;

    if (confirm("Effacer la fiche de " + ancrageActuel + " ?")) {

      localStorage.removeItem(ancrageActuel);

      fermerFiche();

      creerPlan();
    }
  }

  creerPlan();

</script>

</body>
</html>
